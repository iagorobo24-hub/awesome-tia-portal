<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
  <title id="t">Cómo encajan las piezas</title>
  <desc id="d">Cada UDT es la interfaz central: el bloque de función lo recibe como parámetro InOut y el faceplate HMI se enlaza a él. Hay cadenas para motor, válvula y entrada analógica; la pantalla de alarmas depende del UDT de alarma y de un gestor de alarmas que no está incluido.</desc>
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#8f98c8"/>
    </marker>
    <marker id="ar2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#ffb21e"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19d3c5"/><stop offset="1" stop-color="#ffb21e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="560" rx="20" fill="#0d1020"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="48" y="58" font-size="26" font-weight="800" fill="#f4f6ff">Cómo encajan las piezas</text>
    <rect x="48" y="68" width="64" height="4" rx="2" fill="url(#hd)"/>

    <g font-size="15" font-weight="700" fill="#8f98c8" text-anchor="middle" letter-spacing="1">
      <text x="236" y="116">LÓGICA (FB)</text>
      <text x="640" y="116">DATOS (UDT)</text>
      <text x="1044" y="116">HMI</text>
    </g>

    <rect x="96" y="132" width="280" height="76" rx="14" fill="#181d38" stroke="#2c3363"/>
    <text x="236" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f6ff">FB_Motor</text>
    <text x="236" y="190" text-anchor="middle" font-size="14" fill="#b9c1e6">manual/auto, timeouts, horas</text>
    <rect x="500" y="132" width="280" height="76" rx="14" fill="#181d38" stroke="#19d3c5" stroke-width="2"/>
    <text x="640" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#19d3c5">UDT_Motor</text>
    <text x="640" y="190" text-anchor="middle" font-size="14" fill="#b9c1e6">comando · estado · fallos · config</text>
    <rect x="904" y="132" width="280" height="76" rx="14" fill="#181d38" stroke="#2c3363"/>
    <text x="1044" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f6ff">Faceplate_Motor</text>
    <text x="1044" y="190" text-anchor="middle" font-size="14" fill="#b9c1e6">un único binding</text>
    <line x1="498" y1="170" x2="380" y2="170" stroke="#8f98c8" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="782" y1="170" x2="900" y2="170" stroke="#8f98c8" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="96" y="232" width="280" height="76" rx="14" fill="#181d38" stroke="#2c3363"/>
    <text x="236" y="265" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f6ff">FB_Valve</text>
    <text x="236" y="290" text-anchor="middle" font-size="14" fill="#b9c1e6">feedback y timeout</text>
    <rect x="500" y="232" width="280" height="76" rx="14" fill="#181d38" stroke="#19d3c5" stroke-width="2"/>
    <text x="640" y="265" text-anchor="middle" font-size="20" font-weight="700" fill="#19d3c5">UDT_Valve</text>
    <text x="640" y="290" text-anchor="middle" font-size="14" fill="#b9c1e6">abrir/cerrar con feedback</text>
    <rect x="904" y="232" width="280" height="76" rx="14" fill="#181d38" stroke="#2c3363"/>
    <text x="1044" y="265" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f6ff">Faceplate_Valve</text>
    <text x="1044" y="290" text-anchor="middle" font-size="14" fill="#b9c1e6">estado y mando</text>
    <line x1="498" y1="270" x2="380" y2="270" stroke="#8f98c8" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="782" y1="270" x2="900" y2="270" stroke="#8f98c8" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="96" y="332" width="280" height="76" rx="14" fill="#181d38" stroke="#2c3363"/>
    <text x="236" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f6ff">FB_AnalogInput</text>
    <text x="236" y="390" text-anchor="middle" font-size="14" fill="#b9c1e6">escalado, alarmas, filtrado</text>
    <rect x="500" y="332" width="280" height="76" rx="14" fill="#181d38" stroke="#19d3c5" stroke-width="2"/>
    <text x="640" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#19d3c5">UDT_AnalogInput</text>
    <text x="640" y="390" text-anchor="middle" font-size="14" fill="#b9c1e6">raw, escalado, HH/H/L/LL</text>
    <rect x="904" y="332" width="280" height="76" rx="14" fill="#181d38" stroke="#2c3363"/>
    <text x="1044" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f6ff">Faceplate_Analog</text>
    <text x="1044" y="390" text-anchor="middle" font-size="14" fill="#b9c1e6">valor y alarmas</text>
    <line x1="498" y1="370" x2="380" y2="370" stroke="#8f98c8" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="782" y1="370" x2="900" y2="370" stroke="#8f98c8" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="96" y="432" width="280" height="76" rx="14" fill="#0d1020" stroke="#ffb21e" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="236" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb21e">FB_AlarmManager</text>
    <text x="236" y="490" text-anchor="middle" font-size="14" fill="#b9c1e6">no incluido en la librería</text>
    <rect x="500" y="432" width="280" height="76" rx="14" fill="#181d38" stroke="#19d3c5" stroke-width="2"/>
    <text x="640" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#19d3c5">UDT_Alarm</text>
    <text x="640" y="490" text-anchor="middle" font-size="14" fill="#b9c1e6">activa, ack, timestamp, prioridad</text>
    <rect x="904" y="432" width="280" height="76" rx="14" fill="#181d38" stroke="#2c3363"/>
    <text x="1044" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f6ff">Pantalla de Alarmas</text>
    <text x="1044" y="490" text-anchor="middle" font-size="14" fill="#b9c1e6">filtros e histórico</text>
    <line x1="498" y1="470" x2="380" y2="470" stroke="#ffb21e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar2)"/>
    <line x1="782" y1="470" x2="900" y2="470" stroke="#8f98c8" stroke-width="2" marker-end="url(#ar)"/>

    <text x="48" y="540" font-size="13" fill="#8f98c8">La flecha sale del UDT: el FB lo recibe como InOut y el HMI se enlaza a él. Trazo discontinuo: pieza externa no incluida.</text>
  </g>
</svg>
