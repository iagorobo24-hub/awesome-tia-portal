# GitHub Pages (Jekyll) con el tema just-the-docs: navegación lateral,
// buscador y enlace "Editar esta página" en cada documento.
// No afecta a los scripts ni a CI: solo lo usa el build de Pages.
remote_theme: just-the-docs/just-the-docs@v0.12.0
title: Awesome TIA Portal
description: Biblioteca curada de piezas reutilizables para Siemens TIA Portal V20, con estado verificado por recurso.
baseurl: /awesome-tia-portal
color_scheme: dark
search_enabled: true
heading_anchors: true
gh_edit_link: true
gh_edit_repository: https://github.com/iagorobo24-hub/awesome-tia-portal
gh_edit_branch: main
gh_edit_view_mode: edit
footer_content: 'MIT · Proyecto de la comunidad, no afiliado a Siemens.'
exclude:
  - scripts/
  - .github/
  - .git/
  - "*.gemspec"
