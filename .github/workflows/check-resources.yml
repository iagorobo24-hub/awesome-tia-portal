name: Validar Recursos

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'bloques-de-funcion/**'
      - 'tipos-de-datos/**'
      - 'bloques-de-organizacion/**'
      - 'hmi/**'
      - 'plantillas-de-proyecto/**'
      - 'CATALOG.md'
      - 'scripts/**'
      - '.github/workflows/check-resources.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar estructura de subcarpetas
        run: bash scripts/validate-resources.sh

      - name: Verificar que CATALOG.md está sincronizado
        run: |
          python3 scripts/generate_catalog.py --check
